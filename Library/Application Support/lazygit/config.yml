gui:
  theme:
    # Default is the terminal's blue, which washes out blue key labels.
    # Use Harbor Night's selection color (matches nvim and Claude Code) instead.
    selectedLineBgColor:
      - "#252a48"
    inactiveViewSelectedLineBgColor:
      - "#151626"
git:
  diffRenderers:
    - command: delta --{{colorScheme}} --paging=never --line-numbers
