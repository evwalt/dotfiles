[env]
TERM = "xterm-256color"

[font]
normal = { family = "Hack Nerd Font" }
# size = 13.5
size = 14.5

# Option as Alt
#
[window]
option_as_alt = "Both" # (macos only)
decorations = "None"

# Color Theme - Harbor Night: matches the Claude Code theme in ~/.claude/themes/harbor-night.json.
# The zsh prompt and ls use these named colors, so this palette themes them too.
# Previously Midnight Haze: <https://github.com/hafiz-muhammad/midnight-haze-alacritty-theme/blob/main/midnight-haze.toml>
#
# Default colors
[colors.primary]
background = "#0c0c16"
foreground = "#c0c6d6"

# Periwinkle block cursor: softer than the default reversed text color
[colors.cursor]
cursor = "#b1b9f9"
text = "#0c0c16"

[colors.selection]
background = "#252a48"
text = "CellForeground"

# Normal colors
[colors.normal]
black   = "#2c2d45"
red     = "#e08592"
green   = "#8fbf98"
yellow  = "#dbbd84"
blue    = "#7fa9d1"
magenta = "#b996c4"
cyan    = "#6aaa9e"
white   = "#c0c6d6"

# Bright colors
[colors.bright]
black   = "#8a8fb0"
red     = "#ebaab4"
green   = "#b0d4b6"
yellow  = "#ead5ad"
blue    = "#a9c6e3"
magenta = "#d4bddc"
cyan    = "#93c4ba"
white   = "#dce1ec"

# Dim colors: Alacritty's default 0.66 dimming, except white. Claude Code
# (dark-ansi base) draws removed diff lines as dim white; keep it the normal
# text white so removed lines read like added ones (the red background marks them).
[colors.dim]
black   = "#1d1e2e"
red     = "#945860"
green   = "#5e7e64"
yellow  = "#917d57"
blue    = "#54708a"
magenta = "#7a6381"
cyan    = "#467068"
white   = "#c0c6d6"

[keyboard]
bindings = [
  # { key = "Q", mods = "Command", action = "None" }, # This setting is not working. Remapped "Command + Q" to "Hide alacritty" in macOS System Settings instead.
  { key = "W", mods = "Command", action = "None" },

  # macOS-style dashes
  { key = "Minus", mods = "Alt", chars = "–" },
  { key = "Minus", mods = "Alt|Shift", chars = "—" },
]
